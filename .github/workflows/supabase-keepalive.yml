name: Supabase Keep-Alive

# Supabase Free tier, ~7 gün "aktivite" görmeyen projeleri otomatik duraklatıyor.
# ÖNEMLİ: Basit anonim OKUMA isteği Supabase'in aktiflik sayacını SIFIRLAMIYOR
# (test edildi — okuma ping'i 200 dönmesine rağmen proje yine 7 günde durakladı).
# Bu yüzden bu iş gerçek bir VERİTABANI YAZMASI yapıyor: test1furkan hesabıyla
# giriş yapıp o hesabın son log'una "no-op UPDATE" atıyor (watched_at kendine
# eşitlenir). Bu, updated_at trigger'ını tetikleyip gerçek bir write üretir; ama
# watched_at değişmediği için feed sırası/görünümü bozulmaz, id değişmez, hiçbir
# akış etkilenmez.
#
# NOT: Bu hâlâ geçici bir çözüm ve yazmanın da sayacı sıfırlayacağı GARANTİ değil
# (bir sonraki ~7 günlük döngüde doğrulanacak). App Store'a çıkmadan önce Supabase
# Pro'ya geçilmeli — Pro projeler hiç duraklamaz.
#
# Gerekli GitHub secret: SUPABASE_KEEPALIVE_PASSWORD (test1furkan hesabının şifresi).
# Anon (publishable) key ve test hesabının e-postası hassas değil, gömülü bırakıldı.

on:
  schedule:
    - cron: "0 6 */3 * *"   # 3 günde bir, 06:00 UTC
  workflow_dispatch:         # elle de tetiklenebilir

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://muwsslmfbecsgdvuamou.supabase.co"
      ANON_KEY: "sb_publishable_tUsyjFQlgjUJ6K9Vmgv6Mg_uR7jhctY"
      KEEPALIVE_EMAIL: "testuser1@grippd.com"
      KEEPALIVE_PASSWORD: ${{ secrets.SUPABASE_KEEPALIVE_PASSWORD }}
    steps:
      - name: Giriş yap, son log'u oku ve no-op UPDATE at
        run: |
          set -euo pipefail

          if [ -z "${KEEPALIVE_PASSWORD}" ]; then
            echo "::error::SUPABASE_KEEPALIVE_PASSWORD secret'ı ayarlanmamış."
            exit 1
          fi

          # 1) Giriş (password grant) → access_token + user id
          AUTH=$(curl -s -m 30 -X POST \
            "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${ANON_KEY}" -H "Content-Type: application/json" \
            -d "{\"email\":\"${KEEPALIVE_EMAIL}\",\"password\":\"${KEEPALIVE_PASSWORD}\"}")

          JWT=$(echo "$AUTH" | jq -r '.access_token // empty')
          # NOT: değişken adı UID OLMAMALI — UID bash'te salt-okunur (OS user id).
          USER_ID=$(echo "$AUTH" | jq -r '.user.id // empty')

          if [ -z "$JWT" ] || [ -z "$USER_ID" ]; then
            echo "::error::Giriş başarısız (proje duraklamış veya kimlik hatalı olabilir)."
            echo "Yanıt: $(echo "$AUTH" | jq -c '{error, error_description, msg}')"
            exit 1
          fi
          echo "Giriş başarılı — kullanıcı: $USER_ID"

          # 2) Son log'u oku (READ)
          LAST=$(curl -s -m 30 \
            "${SUPABASE_URL}/rest/v1/logs?user_id=eq.${USER_ID}&select=id,watched_at&order=watched_at.desc&limit=1" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${JWT}")

          LOG_ID=$(echo "$LAST" | jq -r '.[0].id // empty')
          WATCHED=$(echo "$LAST" | jq -r '.[0].watched_at // empty')

          if [ -z "$LOG_ID" ]; then
            echo "::error::Log bulunamadı. Yanıt: $LAST"
            exit 1
          fi
          echo "Son log okundu — id: $LOG_ID (watched_at: $WATCHED)"

          # 3) No-op UPDATE (WRITE): watched_at aynı değere set edilir; updated_at
          #    trigger'ı tetiklenir → gerçek yazma. Görünürde hiçbir şey değişmez.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X PATCH \
            "${SUPABASE_URL}/rest/v1/logs?id=eq.${LOG_ID}" \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"watched_at\":\"${WATCHED}\"}")

          echo "UPDATE yanıt kodu: $CODE"
          if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
            echo "::error::Yazma başarısız (HTTP $CODE)."
            exit 1
          fi

          echo "Keep-alive başarılı — okuma + yazma tamamlandı, proje aktif."
