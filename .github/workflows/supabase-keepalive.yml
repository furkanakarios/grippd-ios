name: Supabase Keep-Alive

# Supabase Free tier, ~7 gün hiç istek almayan projeleri otomatik duraklatıyor.
# Bu iş 3 günde bir hafif bir REST sorgusu atarak hareketsizlik sayacını sıfırlar,
# böylece proje uykuya dalmaz.
#
# NOT: Bu geçici bir çözümdür. App Store'a çıkmadan önce Supabase Pro'ya geçilmeli —
# canlı uygulamanın backend'i uyursa kullanıcılar için uygulama kırılır ve
# RevenueCat webhook'ları düşer.
#
# Kullanılan anahtar Supabase "publishable" (anon) anahtarıdır: istemci tarafında
# yayınlanmak üzere tasarlanmıştır, iOS uygulama binary'sinde de bulunur ve
# Row Level Security ile korunur. Gizli (service_role) anahtar DEĞİLDİR.

on:
  schedule:
    - cron: "0 6 */3 * *"   # 3 günde bir, 06:00 UTC
  workflow_dispatch:         # elle de tetiklenebilir

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase'e keep-alive isteği at
        run: |
          SUPABASE_URL="https://muwsslmfbecsgdvuamou.supabase.co"
          ANON_KEY="sb_publishable_tUsyjFQlgjUJ6K9Vmgv6Mg_uR7jhctY"

          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            "${SUPABASE_URL}/rest/v1/content?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}")

          echo "Supabase yanıt kodu: ${STATUS}"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Keep-alive başarısız (HTTP ${STATUS}). Proje duraklatılmış veya erişilemiyor olabilir."
            exit 1
          fi

          echo "Keep-alive başarılı — proje aktif."
